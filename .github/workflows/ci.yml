name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck   # source and tests
      - run: npm test
      # Production dependencies only; fails on a high/critical advisory.
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  agent-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      # No Ollama in CI: the suite covers everything that doesn't need a model
      # (service auth, signed evidence, the audit log, retrieval, config). The
      # live test is skipped unless TRIAGE_LIVE=1.
      - run: python -m pytest app/agent-api -q
      # lar-engine installs from a pinned git commit, which pip-audit cannot
      # look up; everything else is checked.
      - run: pip-audit -r requirements.txt

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, agent-api]
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid (dev, and prod with required secrets supplied)
        env:
          TRIAGE_HMAC_SECRET: ${{ github.sha }}${{ github.sha }}
          TRIAGE_INTERNAL_TOKEN: ${{ github.run_id }}${{ github.sha }}
          ALLOWED_ORIGIN: https://app.example.com
          PUBLIC_BACKEND_URL: https://api.example.com
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Production override refuses to start without secrets
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q 2>/dev/null; then
            echo "prod compose accepted a missing secret"; exit 1
          fi
      - run: docker compose build
