# Local/demo stack:  docker compose up --build   ->  http://localhost:5173
# Runs in APP_ENV=development: demo users are seeded and development secrets are
# allowed (with warnings). For a real deployment use the production override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The model runs in Ollama on your host by default. To run Ollama in compose:
#   OLLAMA_API_BASE=http://ollama:11434 docker compose --profile with-ollama up --build
#   docker compose exec ollama ollama pull qwen2.5:14b

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  agent-api:
    <<: *hardening
    build:
      context: .
      dockerfile: app/agent-api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-ollama/qwen2.5:14b}
      TRIAGE_HMAC_SECRET: ${TRIAGE_HMAC_SECRET:-dev-only-not-a-real-secret}
      TRIAGE_INTERNAL_TOKEN: ${TRIAGE_INTERNAL_TOKEN:-dev-only-internal-token}
      TRIAGE_RAG: ${TRIAGE_RAG:-1}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Not published: only the backend can reach it, over the compose network.
    expose: ["8010"]
    volumes:
      - audit:/data
    read_only: true
    tmpfs:
      - /tmp
      - /srv/app/agent-api/lar_logs   # flight-recorder logs may hold the raw submission: never persist them

  backend:
    <<: *hardening
    build: ./app/backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      AGENT_API_URL: http://agent-api:8010
      TRIAGE_INTERNAL_TOKEN: ${TRIAGE_INTERNAL_TOKEN:-dev-only-internal-token}
      ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - appdata:/data
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      agent-api:
        condition: service_healthy

  frontend:
    <<: *hardening
    build:
      context: ./app/frontend
      args:
        VITE_BACKEND_URL: http://localhost:${BACKEND_PORT:-4000}
    environment:
      BACKEND_ORIGIN: http://localhost:${BACKEND_PORT:-4000}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755   # nginx (uid 101) renders its config here at start
    read_only: true
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    profiles: ["with-ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  audit:
  appdata:
  ollama:
